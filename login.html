<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify - Cadastre-se ou Entre</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-header">
      <i class="fa-brands fa-spotify spotify-logo"></i>
      <h1>Música para todos.</h1>
    </div>

    <!-- Alternador de Abas -->
    <div class="auth-tabs">
      <button id="tab-register" class="tab-btn active">Criar Conta</button>
      <button id="tab-login" class="tab-btn">Entrar</button>
    </div>

    <!-- Formulário de Cadastro -->
    <form id="register-form" class="auth-form">
      <div class="input-group">
        <label for="reg-email">E-mail</label>
        <input type="email" id="reg-email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="input-group">
        <label for="reg-password">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="reg-password" placeholder="Crie uma senha forte" required minlength="6">
      </div>

      <button type="submit" class="btn-primary btn-block">Inscrever-se</button>
    </form>

    <!-- Formulário de Login -->
    <form id="login-form" class="auth-form hidden">
      <div class="input-group">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="input-group">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="Sua senha" required>
      </div>

      <button type="submit" class="btn-primary btn-block">Entrar</button>
    </form>

    <div id="auth-error" class="error-message"></div>
  </div>

  <script type="module" src="./firebaseconfig.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
